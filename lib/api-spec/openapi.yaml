openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ICAMMDA Website API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Blog posts and news
  - name: events
    description: Events and programs
  - name: team
    description: Team members
  - name: partners
    description: Partner organizations
  - name: research
    description: Research groups and members
  - name: stats
    description: Website statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List all posts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: published
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: published
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List all team members
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Create a team member
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamMemberBody"
      responses:
        "201":
          description: Created team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Update a team member
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberBody"
      responses:
        "200":
          description: Updated team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Not found
    delete:
      operationId: deleteTeamMember
      tags: [team]
      summary: Delete a team member
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /research-groups:
    get:
      operationId: listResearchGroups
      tags: [research]
      summary: List all research groups with their members
      responses:
        "200":
          description: List of research groups with members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchGroupWithMembers"
    post:
      operationId: createResearchGroup
      tags: [research]
      summary: Create a research group
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchGroupBody"
      responses:
        "201":
          description: Created research group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchGroup"

  /research-groups/{id}:
    patch:
      operationId: updateResearchGroup
      tags: [research]
      summary: Update a research group
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResearchGroupBody"
      responses:
        "200":
          description: Updated research group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchGroup"
        "404":
          description: Not found
    delete:
      operationId: deleteResearchGroup
      tags: [research]
      summary: Delete a research group
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /research-members:
    get:
      operationId: listResearchMembers
      tags: [research]
      summary: List research members (optionally filter visiting scholars)
      parameters:
        - name: visiting
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of research members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchMember"
    post:
      operationId: createResearchMember
      tags: [research]
      summary: Create a research member
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchMemberBody"
      responses:
        "201":
          description: Created research member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchMember"

  /research-members/{id}:
    patch:
      operationId: updateResearchMember
      tags: [research]
      summary: Update a research member
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResearchMemberBody"
      responses:
        "200":
          description: Updated research member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchMember"
        "404":
          description: Not found
    delete:
      operationId: deleteResearchMember
      tags: [research]
      summary: Delete a research member
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List all partners
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [partners]
      summary: Create a partner
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartnerBody"
      responses:
        "201":
          description: Created partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"

  /partners/{id}:
    patch:
      operationId: updatePartner
      tags: [partners]
      summary: Update a partner
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartnerBody"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found
    delete:
      operationId: deletePartner
      tags: [partners]
      summary: Delete a partner
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stats:
    get:
      operationId: getSiteStats
      tags: [stats]
      summary: Get website statistics summary
      responses:
        "200":
          description: Site statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"

  /posts/recent:
    get:
      operationId: getRecentPosts
      tags: [posts]
      summary: Get recent posts
      responses:
        "200":
          description: Recent posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /events/upcoming:
    get:
      operationId: getUpcomingEvents
      tags: [events]
      summary: Get upcoming events
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        content:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        published:
          type: boolean
        featured:
          type: boolean
        authorName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - content
        - category
        - published
        - featured
        - createdAt
        - updatedAt

    CreatePostBody:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        content:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        published:
          type: boolean
        featured:
          type: boolean
        authorName:
          type: ["string", "null"]
      required:
        - title
        - slug
        - content
        - category

    UpdatePostBody:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        content:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        published:
          type: boolean
        featured:
          type: boolean
        authorName:
          type: ["string", "null"]

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        eventType:
          type: string
        location:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time
        imageUrl:
          type: ["string", "null"]
        formType:
          type: string
          description: "none | google | custom"
        googleFormUrl:
          type: ["string", "null"]
        customFormFields:
          type: ["string", "null"]
          description: JSON string of custom form fields
        published:
          type: boolean
        featured:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - description
        - eventType
        - formType
        - published
        - featured
        - createdAt
        - updatedAt

    CreateEventBody:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        eventType:
          type: string
        location:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        formType:
          type: string
        googleFormUrl:
          type: ["string", "null"]
        customFormFields:
          type: ["string", "null"]
        published:
          type: boolean
        featured:
          type: boolean
      required:
        - title
        - slug
        - description
        - eventType
        - formType

    UpdateEventBody:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        eventType:
          type: string
        location:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        formType:
          type: string
        googleFormUrl:
          type: ["string", "null"]
        customFormFields:
          type: ["string", "null"]
        published:
          type: boolean
        featured:
          type: boolean

    TeamMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: string
        bio:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        role:
          type: string
          description: "director | researcher | staff | postdoc"
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - title
        - role
        - order
        - createdAt
        - updatedAt

    CreateTeamMemberBody:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        bio:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        role:
          type: string
        order:
          type: integer
      required:
        - name
        - title
        - role

    UpdateTeamMemberBody:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        bio:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        role:
          type: string
        order:
          type: integer

    Partner:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - order
        - createdAt
        - updatedAt

    CreatePartnerBody:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        order:
          type: integer
      required:
        - name

    UpdatePartnerBody:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        order:
          type: integer

    ResearchGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - order
        - createdAt
        - updatedAt

    ResearchMember:
      type: object
      properties:
        id:
          type: integer
        groupId:
          type: ["integer", "null"]
        name:
          type: string
        role:
          type: string
        affiliation:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        isVisiting:
          type: boolean
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - role
        - isVisiting
        - order
        - createdAt
        - updatedAt

    ResearchGroupWithMembers:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        order:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/ResearchMember"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - order
        - members
        - createdAt
        - updatedAt

    CreateResearchGroupBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        order:
          type: integer
      required:
        - name

    UpdateResearchGroupBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        order:
          type: integer

    CreateResearchMemberBody:
      type: object
      properties:
        groupId:
          type: ["integer", "null"]
        name:
          type: string
        role:
          type: string
        affiliation:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        isVisiting:
          type: boolean
        order:
          type: integer
      required:
        - name
        - role

    UpdateResearchMemberBody:
      type: object
      properties:
        groupId:
          type: ["integer", "null"]
        name:
          type: string
        role:
          type: string
        affiliation:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        isVisiting:
          type: boolean
        order:
          type: integer

    SiteStats:
      type: object
      properties:
        totalPosts:
          type: integer
        totalEvents:
          type: integer
        totalTeamMembers:
          type: integer
        totalPartners:
          type: integer
        upcomingEvents:
          type: integer
        recentPosts:
          type: integer
      required:
        - totalPosts
        - totalEvents
        - totalTeamMembers
        - totalPartners
        - upcomingEvents
        - recentPosts
